[package]
name = "opensearch-parquet-format"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
workspace = "../../../../../libs/dataformat-native/rust"

[features]
test-utils = []

[lib]
name = "opensearch_parquet_format"
crate-type = ["rlib"]

[dependencies]
arrow = { workspace = true }
parquet = { workspace = true }
arrow-ipc = { workspace = true }
lazy_static = { workspace = true }
dashmap = { workspace = true }
tempfile = { workspace = true }
native-bridge-common = { workspace = true }
rayon = { workspace = true }
tokio = { workspace = true }
crc32fast = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
opensearch-parquet-format = { path = ".", features = ["test-utils"] }
# getrusage() for process CPU time in benches; version already pinned in the workspace lock.
libc = "=0.2.186"


[[bench]]
name = "merge_projection_bench"
harness = false

[[bench]]
name = "merge_push_batch_gate_bench"
harness = false

[[bench]]
name = "merge_run_coalescing_bench"
harness = false

[[bench]]
name = "bloom_ndv_bench"
harness = false
